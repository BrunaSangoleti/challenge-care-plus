    <main class="content">
        <h1 class="page-title">Guia de Prevenção</h1>
        <div class="title-underline"></div>

        <!-- Card de Histórico de Retornos -->
        <div class="prevention-card">
            <h2 class="card-subtitle">Histórico de Retornos</h2>

            <table class="history-table">
                <thead class="table-header">
                    <tr>
                        <th>Exame</th>
                        <th>Status</th>
                        <th>Recomendação</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linha: Check-up Geral -->
                    <tr class="table-row">
                        <td><strong>Check-up Geral</strong></td>
                        <td><span class="status-badge status-on-time">EM DIA</span></td>
                        <td>Próximo em 12 meses</td>
                    </tr>

                    <!-- Linha: Odontologia -->
                    <tr class="table-row">
                        <td><strong>Odontologia</strong></td>
                        <td><span class="status-badge status-late">ATRASADO</span></td>
                        <td>
                            <a href="./Agendar-consulta.html" class="btn-schedule-now">Agendar agora</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
