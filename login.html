<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Care Plus</title>
</head>
<body style="background-color: var(--cinza-fundo);">
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center vh-100 py-5">
        
        <div class="mb-4 text-center" style="background-color: var(--azul-escuro); padding: 15px 40px; border-radius: 12px; box-shadow: var(--sombra-card);">
            <img src="./src/img/logo.png" alt="Care Plus Logo" style="max-width: 180px;">
        </div>

        <section class="p-4 rounded bg-white" style="width: 100%; max-width: 400px; box-shadow: var(--sombra-card); border: 1px solid var(--cinza-borda);">
            <h2 class="mb-4 text-center fw-bold" style="color: var(--azul-escuro); font-size: 1.5rem;">Acesse sua conta</h2>
            <form action="login.php" method="POST">
                <div class="custom-form-group mb-3">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="custom-form-group mb-4">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn-confirm w-100 py-2 rounded fw-bold" style="border: none; font-size: 1rem;">Entrar</button>
            </form>
        </section>
    </div>
</body>
</html>
