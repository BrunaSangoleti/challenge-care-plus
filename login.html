<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Care Plus</title>
</head>
<body>
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center vh-100 py-5">
        
        <div class="care-plus-logo mb-4 text-center">
            <img src="./src/img/logo.png" alt="Care Plus Logo" style="max-width: 180px;">
        </div>

        <section class="card-login p-4 rounded bg-white">
            <h2 class="mb-4 text-center fw-bold">Acesse sua conta</h2>
            <form id="form-login">
                <div class="custom-form-group mb-3">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" value="joaosilva@email.com" required>
                </div>
                <div class="custom-form-group mb-4">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" value="joaosilva123" required>
                </div>
                <div class="action-buttons">
                    <button type="button" id="btn-login" class="btn-login w-100 py-2 rounded fw-bold">Entrar</button>
                </div>
            </form>
        </section>
    </div>
    <script src="./src/js/btnListener.js"></script>
</body>
</html>
